name: Build Workshop app

# Builds the RCRotations Workshop desktop app for Windows.
# - Push a tag like app-v1.0.1 to publish a GitHub release with the .exe.
# - Or run it by hand (Actions > Build Workshop app > Run workflow) to get the
#   .exe as a downloadable build artifact.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#app-v}"

      - name: Build
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: RCRotations-Workshop
          path: app/dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --title "RCRotations Workshop ${GITHUB_REF_NAME#app-v}" \
            --notes "Windows desktop app for editing WoWSims rotations and saving them straight into RCRotations. Download the .exe and run it; Windows may ask you to confirm because the app isn't code-signed."
