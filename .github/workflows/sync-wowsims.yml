name: Sync WoWSims rotations

# Daily, and whenever you add a rotation under rotations/: regenerate
# SimData_Mists.lua from the latest WoWSims MoP rotations plus your own
# (rotations/mists/<class>/<spec>/*.json).
#
# If something changed:
# - With the repository variable AUTO_RELEASE set to "true" (Settings >
#   Secrets and variables > Actions > Variables), and the update passing the
#   safety check (tests pass, no rotation removed, nothing unsupported), it is
#   committed to main, the version is bumped, and a release is published
#   (GitHub release, plus CurseForge/Wago when those are configured).
# - Otherwise, or if the safety check fails, it opens a pull request with the
#   import report for you to review.
on:
  push:
    branches: [main]
    paths:
      - "rotations/**"
      - "tools/wowsims_convert.py"
      - "tools/forever_convert.py"
      - "tools/forever_export.sh"
      - "tools/build_workshop_data.py"
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC (3:17 am Alberta time)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wowsims-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch WoWSims rotation files
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wowsims/mop wowsims-mop
          git -C wowsims-mop sparse-checkout set --no-cone 'LICENSE' '/ui/specs/**/apls/*' '/assets/database/db.json' '/assets/database/leftover_db.json'

      # WoW Forever: WoWSims writes some Forever rotations in SIML, read with its
      # CLI (Go + protoc), so tools/forever_export.sh turns them all into JSON.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Fetch WoWSims Forever
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          python3 -m zipfile -e "$RUNNER_TEMP/protoc.zip" "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/wowsims/forever wowsims-forever

      - name: Convert WoW Forever rotations
        run: |
          cp SimData_Forever.lua old-forever.lua
          tools/forever_export.sh wowsims-forever forever-export/json
          python3 tools/forever_convert.py --sims wowsims-forever --export forever-export/json \
            --out SimData_Forever.lua --report forever-report.md --summary forever-summary.json
          echo "FOREVER_SHA=$(git -C wowsims-forever rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"

      - name: Convert
        run: |
          cp SimData_Mists.lua old-simdata.lua
          python3 tools/wowsims_convert.py --sims wowsims-mop --custom rotations/mists \
            --tuning rotations/tuning/mists.json --out SimData_Mists.lua --report sim-report.md --summary sim-summary.json
          pip install lupa
          python3 tools/build_workshop_data.py --sims wowsims-mop --custom rotations/mists --out app/data
          echo "SIMS_SHA=$(git -C wowsims-mop rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"

      - name: Test
        env:
          WOWSIMS_MOP: wowsims-mop
        run: |
          pip install lupa
          python3 tools/test_sim.py

      - name: Anything changed?
        id: changed
        run: |
          if git diff --quiet -- SimData_Mists.lua SimData_Forever.lua app/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No rotation changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Safety check
        id: guard
        if: steps.changed.outputs.changed == 'true'
        run: |
          safe=true
          python3 tools/sync_release.py guard old-simdata.lua SimData_Mists.lua sim-summary.json > guard.txt || safe=false
          python3 tools/sync_release.py guard old-forever.lua SimData_Forever.lua forever-summary.json > guard-forever.txt || safe=false
          echo "safe=$safe" >> "$GITHUB_OUTPUT"
          cat guard.txt guard-forever.txt
          { echo "**Safety check (MoP):** $(cat guard.txt)"; echo; echo "**Safety check (WoW Forever):** $(cat guard-forever.txt)"; echo;
            cat sim-report.md; echo; cat forever-report.md; } > pr-body.md

      - name: Release automatically
        id: release
        if: >-
          steps.changed.outputs.changed == 'true' &&
          steps.guard.outputs.safe == 'true' &&
          vars.AUTO_RELEASE == 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          VERSION=$(python3 tools/sync_release.py bump "$SIMS_SHA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SimData_Mists.lua SimData_Forever.lua app/data RCRotations.toc RCRotations_Camelot.toc VERSION.txt Changelog.lua
          git commit -m "Update WoWSims rotations (wowsims/mop@$SIMS_SHA, wowsims/forever@$FOREVER_SHA), v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Tags pushed by this workflow don't start other workflows, so package here.
      - name: Package and publish
        if: steps.release.outputs.version != ''
        uses: BigWigsMods/packager@v2

      - name: Open pull request
        if: >-
          steps.changed.outputs.changed == 'true' &&
          steps.release.outputs.version == ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: wowsims-sync
          delete-branch: true
          add-paths: |
            SimData_Mists.lua
            SimData_Forever.lua
            app/data
          commit-message: "Update WoWSims rotations (wowsims/mop@${{ env.SIMS_SHA }}, wowsims/forever@${{ env.FOREVER_SHA }})"
          title: "Update WoWSims rotations (mop@${{ env.SIMS_SHA }}, forever@${{ env.FOREVER_SHA }})"
          body-path: pr-body.md
          labels: wowsims
