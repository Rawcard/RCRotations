name: Sync WoWSims rotations

# Daily, and whenever you add a rotation under rotations/: regenerate
# SimData_Mists.lua from the latest WoWSims MoP rotations plus your own
# (rotations/mists/<class>/<spec>/*.json).
#
# If something changed:
# - With the repository variable AUTO_RELEASE set to "true" (Settings >
#   Secrets and variables > Actions > Variables), and the update passing the
#   safety check (tests pass, no rotation removed, nothing unsupported), it is
#   committed to main, the version is bumped, and a release is published
#   (GitHub release, plus CurseForge/Wago when those are configured).
# - Otherwise, or if the safety check fails, it opens a pull request with the
#   import report for you to review.
on:
  push:
    branches: [main]
    paths:
      - "rotations/**"
      - "tools/wowsims_convert.py"
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC (3:17 am Alberta time)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wowsims-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch WoWSims rotation files
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wowsims/mop wowsims-mop
          git -C wowsims-mop sparse-checkout set --no-cone 'LICENSE' '/ui/specs/**/apls/*'

      - name: Convert
        run: |
          cp SimData_Mists.lua old-simdata.lua
          python3 tools/wowsims_convert.py --sims wowsims-mop --custom rotations/mists \
            --out SimData_Mists.lua --report sim-report.md --summary sim-summary.json
          echo "SIMS_SHA=$(git -C wowsims-mop rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"

      - name: Test
        env:
          WOWSIMS_MOP: wowsims-mop
        run: |
          pip install lupa
          python3 tools/test_sim.py

      - name: Anything changed?
        id: changed
        run: |
          if git diff --quiet -- SimData_Mists.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No rotation changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Safety check
        id: guard
        if: steps.changed.outputs.changed == 'true'
        run: |
          if python3 tools/sync_release.py guard old-simdata.lua SimData_Mists.lua sim-summary.json > guard.txt; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi
          cat guard.txt
          { echo "**Safety check:** $(cat guard.txt)"; echo; cat sim-report.md; } > pr-body.md

      - name: Release automatically
        id: release
        if: >-
          steps.changed.outputs.changed == 'true' &&
          steps.guard.outputs.safe == 'true' &&
          vars.AUTO_RELEASE == 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          VERSION=$(python3 tools/sync_release.py bump "$SIMS_SHA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SimData_Mists.lua RCRotations.toc RCRotations_Camelot.toc VERSION.txt
          git commit -m "Update WoWSims rotations (wowsims/mop@$SIMS_SHA), v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Tags pushed by this workflow don't start other workflows, so package here.
      - name: Package and publish
        if: steps.release.outputs.version != ''
        uses: BigWigsMods/packager@v2

      - name: Open pull request
        if: >-
          steps.changed.outputs.changed == 'true' &&
          steps.release.outputs.version == ''
        uses: peter-evans/create-pull-request@v6
        with:
          branch: wowsims-sync
          delete-branch: true
          add-paths: SimData_Mists.lua
          commit-message: "Update WoWSims rotations (wowsims/mop@${{ env.SIMS_SHA }})"
          title: "Update WoWSims rotations (wowsims/mop@${{ env.SIMS_SHA }})"
          body-path: pr-body.md
          labels: wowsims
