name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch WoWSims rotation files (for the converter parity test)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wowsims/mop wowsims-mop
          git -C wowsims-mop sparse-checkout set --no-cone 'LICENSE' '/ui/specs/**/apls/*'
      - name: WoWSims pipeline tests
        env:
          WOWSIMS_MOP: wowsims-mop
        run: |
          pip install lupa
          python3 tools/test_sim.py
      - name: WoW Forever tests (all classes, secret values in combat)
        run: python3 tools/test_forever.py
      - name: Workshop app tests
        run: node app/test/wow.test.js
